[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexrag"
version = "0.1.1"
description = "CortexRAG library for quick search and creation of RAG systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.15",
    "langgraph>=1.1.9",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "transformers>=5.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
